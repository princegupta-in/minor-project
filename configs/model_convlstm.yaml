# ConvLSTM model config — Deoghar Forest Cover
name: convlstm_v1

seq_length: 8
target_offset: 1

model: convlstm
n_classes: 2
model_kwargs:
  in_channels: 12       # 10 S2 bands/indices + DEM + slope
  hidden_channels: [32, 64]
  kernel_size: 3
  n_classes: 2

epochs: 60
batch_size: 4
num_workers: 2
lr: 1.0e-3
weight_decay: 1.0e-4
loss: focal
focal_gamma: 2.0
amp: true
grad_accum_steps: 2    # effective batch = 8
save_every: 5
early_stop_patience: 10

ckpt_dir: outputs/checkpoints
log_dir: outputs/runs
